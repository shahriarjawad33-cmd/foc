<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      background: #000000;
      overflow: hidden;
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: #000000;
      outline: none;
      display: block;
    }
  </style>
</head>
<body>
  <video id="vid" src="stiv.mp4" autoplay loop playsinline controls></video>

  <script>
    const vid = document.getElementById("vid");
    const SOUND_BOOST = 2.5; // প্রয়োজনে 3.0 বা 4.0 করে আরও বাড়াতে পারো

    let audioCtx = null;
    let gainNode = null;
    let sourceConnected = false;
    let keepUnmuted = true;

    function enableAudioBoost() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;

      if (!audioCtx) {
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
      if (!sourceConnected) {
        try {
          const source = audioCtx.createMediaElementSource(vid);
          gainNode = audioCtx.createGain();
          gainNode.gain.value = SOUND_BOOST;
          source.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          sourceConnected = true;
        } catch (e) {}
      } else if (gainNode) {
        gainNode.gain.value = SOUND_BOOST;
      }
    }

    function forceSoundOn() {
      if (!keepUnmuted) return;
      vid.muted = false;
      vid.volume = 1.0;
      enableAudioBoost();
      if (vid.paused) {
        vid.play().catch(() => {});
      }
    }

    // শুরুতেই সাউন্ড অন রেখে চালানোর চেষ্টা
    vid.muted = false;
    vid.volume = 1.0;
    vid.play().then(() => {
      enableAudioBoost();
    }).catch(() => {
      // ব্রাউজার সাউন্ডসহ অটো-প্লে আটকালে সাময়িকভাবে মিউট করে ভিডিও চালু রাখবে
      vid.muted = true;
      vid.play().catch(() => {});
    });

    // ইউজার ক্লিক, টাচ বা কিবোর্ডে চাপ দিলে সাথে সাথে আনমিউট করে সাউন্ড বুস্ট করবে
    ["pointerdown", "click", "touchstart", "keydown"].forEach((evt) => {
      document.addEventListener(evt, () => {
        keepUnmuted = true;
        forceSoundOn();
      }, { passive: true });
    });

    // মিউট হয়ে গেলে আবার অন করার চেষ্টা
    vid.addEventListener("volumechange", () => {
      if (keepUnmuted && vid.muted) {
        vid.muted = false;
        vid.volume = 1.0;
        enableAudioBoost();
      }
    });
  </script>
</body>
</html>
