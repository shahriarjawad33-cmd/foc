<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    video {
      max-width: 100%;
      max-height: 100%;
      background: #000000;
      outline: none;
    }
  </style>
</head>
<body>
  <video id="vid" src="stiv.mp4" autoplay loop playsinline controls></video>

  <script>
    const vid = document.getElementById("vid");
    // ব্রাউজার সাউন্ডসহ অটো-প্লে আটকালে মিউট করে হলেও শুরু করবে, ক্লিক করলে আনমিউট/প্লে হবে
    vid.play().catch(() => {
      vid.muted = true;
      vid.play().catch(() => {});
    });
  </script>
</body>
</html>
