<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      background: #000000;
      overflow: hidden;
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000000;
      outline: none;
      display: block;
    }
  </style>
</head>
<body>
  <video id="vid" preload="auto" autoplay loop playsinline controls></video>

  <script>
    const vid = document.getElementById("vid");
    const videos = ["stiv.mp4", "go.mp4"];
    const randomVideo = videos[Math.floor(Math.random() * videos.length)];
    vid.src = randomVideo;

    const SOUND_BOOST = 2.5; // প্রয়োজনে 3.0 বা 3.5 করতে পারো

    let audioCtx = null;
    let gainNode = null;
    let sourceConnected = false;
    let userUnlockedSound = false;

    function setupBoost() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;

      if (!audioCtx) {
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
      if (!sourceConnected) {
        try {
          const source = audioCtx.createMediaElementSource(vid);
          gainNode = audioCtx.createGain();
          gainNode.gain.value = SOUND_BOOST;
          source.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          sourceConnected = true;
        } catch (e) {}
      } else if (gainNode) {
        gainNode.gain.value = SOUND_BOOST;
      }
    }

    function attemptPlay() {
      if (userUnlockedSound) {
        vid.muted = false;
        vid.volume = 1.0;
        setupBoost();
      }
      return vid.play().then(() => {
        if (userUnlockedSound) setupBoost();
        return true;
      }).catch(() => false);
    }

    // শুরুতেই লোডিং ও প্লে শুরু করার চেষ্টা
    vid.load();
    vid.muted = false;
    vid.volume = 1.0;

    attemptPlay().then((ok) => {
      if (!ok && !userUnlockedSound) {
        vid.muted = true;
        vid.play().catch(() => {});
      }
    });

    // ভিডিও ডেটা রেডি হলেই সাথে সাথে প্লে শুরু করবে
    ["loadedmetadata", "loadeddata", "canplay"].forEach((evt) => {
      vid.addEventListener(evt, () => {
        if (vid.paused) {
          attemptPlay().then((ok) => {
            if (!ok && !userUnlockedSound) {
              vid.muted = true;
              vid.play().catch(() => {});
            }
          });
        }
      });
    });

    // কোনো কারণে ভিডিও পজ হয়ে গেলে দ্রুত আবার চালু করার চেষ্টা
    setInterval(() => {
      if (vid.paused && vid.readyState >= 2) {
        attemptPlay().then((ok) => {
          if (!ok && !userUnlockedSound) {
            vid.muted = true;
            vid.play().catch(() => {});
          }
        });
      } else if (!userUnlockedSound && vid.muted) {
        vid.muted = false;
        vid.volume = 1.0;
        vid.play().then(() => setupBoost()).catch(() => {
          vid.muted = true;
        });
      }
    }, 600);

    // ক্লিক, টাচ বা কিবোর্ড চাপলে সাউন্ড অন + বুস্ট + প্লে নিশ্চিত করবে
    ["pointerdown", "click", "touchstart", "keydown"].forEach((evt) => {
      document.addEventListener(evt, () => {
        userUnlockedSound = true;
        vid.muted = false;
        vid.volume = 1.0;
        setupBoost();
        if (vid.paused) {
          vid.play().catch(() => {});
        }
      }, { passive: true });
    });
  </script>
</body>
</html>
