<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      background: #000000;
      overflow: hidden;
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: #000000;
      outline: none;
      display: block;
    }
  </style>
</head>
<body>
  <video id="vid" src="stiv.mp4" autoplay loop playsinline controls></video>

  <script>
    const vid = document.getElementById("vid");
    const SOUND_BOOST = 2.5; // 1.0 = 100%, 2.5 = 250% (প্রয়োজনে বাড়িয়ে 3.0 বা 4.0 করতে পারো)

    let audioCtx = null;
    let gainNode = null;
    let sourceConnected = false;

    function setupBoost() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;

      if (!audioCtx) {
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
      if (!sourceConnected) {
        try {
          const source = audioCtx.createMediaElementSource(vid);
          gainNode = audioCtx.createGain();
          gainNode.gain.value = SOUND_BOOST;
          source.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          sourceConnected = true;
        } catch (e) {}
      } else if (gainNode) {
        gainNode.gain.value = SOUND_BOOST;
      }
    }

    vid.volume = 1.0;
    vid.muted = false;

    vid.play().then(() => {
      setupBoost();
    }).catch(() => {
      // ব্রাউজার সাউন্ডসহ অটো-প্লে আটকালে মিউট অবস্থায় শুরু করবে
      vid.muted = true;
      vid.play().catch(() => {});
    });

    // পেজ বা ভিডিওতে যেকোনো ক্লিক/টাচ করলে আনমিউট করে সাউন্ড বুস্ট চালু করবে
    ["click", "touchstart", "keydown"].forEach((eventName) => {
      document.addEventListener(eventName, () => {
        vid.muted = false;
        vid.volume = 1.0;
        setupBoost();
        if (vid.paused) {
          vid.play().catch(() => {});
        }
      }, { once: false });
    });
  </script>
</body>
</html>
